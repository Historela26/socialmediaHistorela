  <script>
    const cursorMagico = document.querySelector(".cursor-magico");

    if (
      window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
      window.matchMedia("(min-width: 600px)").matches
    ) {
      let x = window.innerWidth / 2;
      let y = window.innerHeight / 2;
      let objetivoX = x;
      let objetivoY = y;
      let ultimoDestello = 0;

      document.addEventListener("pointermove", (evento) => {
        objetivoX = evento.clientX;
        objetivoY = evento.clientY;

        const ahora = performance.now();
        if (ahora - ultimoDestello > 75) {
          ultimoDestello = ahora;
          crearDestello(objetivoX, objetivoY);
        }
      });

      document.addEventListener("pointerdown", (evento) => {
        for (let i = 0; i < 5; i++) {
          crearDestello(
            evento.clientX + (Math.random() - 0.5) * 24,
            evento.clientY + (Math.random() - 0.5) * 24,
            true
          );
        }
      });

      function seguirCursor() {
        x += (objetivoX - x) * 0.22;
        y += (objetivoY - y) * 0.22;
        cursorMagico.style.left = `${x}px`;
        cursorMagico.style.top = `${y}px`;
        requestAnimationFrame(seguirCursor);
      }

      function crearDestello(x, y, extra = false) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches && !extra) return;

        const destello = document.createElement("span");
        destello.className = "destello-magico";
        destello.style.left = `${x + (Math.random() - 0.5) * (extra ? 8 : 18)}px`;
        destello.style.top = `${y + (Math.random() - 0.5) * (extra ? 8 : 18)}px`;
        destello.style.width = `${extra ? 9 : 5 + Math.random() * 5}px`;
        destello.style.height = destello.style.width;
        document.body.appendChild(destello);
        destello.addEventListener("animationend", () => destello.remove());
      }

      seguirCursor();
    }
  </script>
